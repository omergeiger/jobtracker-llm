name: Israel Israeli
current_role: Data Scientist @ Orchard Analytics Ltd.
years_of_experience: 3
seniority: Junior to mid-level

# ─── Role Type ────────────────────────────────────────────────────────────────
role_type:
  open_to:
    - data_scientist
    - senior_data_analyst
    - machine_learning_engineer
  ideal: >
    Data Scientist (junior to mid level) on a product-facing data science team, building
    models that ship: churn, forecasting, experimentation, recommendations.
  notes: >
    Individual contributor track. Senior Data Analyst and ML Engineer roles are good secondary
    targets. Senior, staff, lead and management roles are a stretch at 3 years of experience.
    Would value a team with other data scientists and mentorship.

# ─── Location ─────────────────────────────────────────────────────────────────
location:
  current_country: Israel
  tiers:                      # priority-ordered, tier 1 = best
    - tier: 1
      type: hybrid
      area: Tel Aviv area
      detail: "Tel Aviv, Herzliya, Ramat Gan, Petah Tikva and nearby cities"
      max_office_days: 3
    - tier: 2
      type: remote
      area: Remote within Israel
      detail: "Fully remote from Israel is fine"
      max_office_days: null
  open_to_relocation: false

# ─── Company Stage ────────────────────────────────────────────────────────────
company_stage:
  preferred:
    - product_company_any_size
  acceptable:
    - large_enterprise_or_big_tech
    - growth_startup
  notes: >
    Prefers product companies over services or consulting; any size.

# ─── Domains ──────────────────────────────────────────────────────────────────
domains:
  primary:                    # strongest pull
    - product data science (churn, experimentation / A/B testing, forecasting, recommendations)
    - applied machine learning on product data
  open_to:                    # mild positive, unordered
    - analytics / business intelligence
    - machine learning engineering / MLOps
  notes: >
    No domains to avoid.

# ─── Hard Dealbreakers (auto-reject signals) ─────────────────────────────────
dealbreakers:
  - requires security clearance
  - fully on-site 5 days a week

# ─── Bonus Factors (boost score when present) ────────────────────────────────
bonus_factors:
  - Python / SQL stack (pandas, scikit-learn)
  - product company
  - mentorship or an existing team of data scientists
