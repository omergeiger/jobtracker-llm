# scoring_rules.yaml - fictional test persona (Israel Israeli), generated by the build-profile skill.
# score = domain + location + seniority + bonus - penalty, clamped to [0, 100].
# Matching is case-insensitive substring matching; quoted spaces act as word boundaries.

# ── Title early exits (title only) ───────────────────────────────────────────
title_exclusions:
  hard:                       # regex on the title -> dealbreaker
    regex: '\b(intern|internship|new\s+grad|new\s+graduate)\b'
    reason: "intern or new-grad role"
    score: 5
  soft:                       # title contains a phrase -> this score (not a dealbreaker)
    score: 15
    phrases:
      - "counsel"
      - "attorney"
      - "accountant"
      - "finance manager"
      - "field marketing"
      - "content marketing"
      - "brand manager"
      - "recruiter"
      - "talent acquisition"
      - "human resources"
      - "people operations"
      - "account executive"
      - "sales development representative"
      - "sales manager"
      - "customer success"
      - "customer support"
      - "graphic designer"
      - "administrative"

# ── Dealbreakers (full text): any_of matches AND no unless_any_of matches ────
dealbreakers:
  score: 5
  rules:
    - reason: "Requires a security clearance"
      any_of: ["security clearance", "clearance required", "active clearance", "secret clearance"]
      unless_any_of: []
    - reason: "Fully on-site 5 days a week"
      any_of: ["5 days a week in the office", "five days a week in the office", "5 days in the office",
               "fully on-site", "fully onsite", "100% on-site", "100% onsite"]
      unless_any_of: ["hybrid", "remote"]

# ── Domain (full text) ───────────────────────────────────────────────────────
domains:
  primary:
    label: "Product data science / applied ML"
    points: 35
    keywords: ["data scientist", "data science", "machine learning", "predictive model",
               "statistical model", "scikit-learn", "sklearn", "xgboost", "churn", "forecasting",
               "a/b test", "a/b testing", "experimentation", "causal inference",
               "recommendation", "personalization", "propensity", "classification model"]
  open_to:                    # checked in order, first match wins
    points: 22
    areas:
      - label: "ML engineering / MLOps"
        keywords: ["ml engineer", "machine learning engineer", "mlops", "model deployment",
                   "model serving", "feature store", "ml platform", "model monitoring"]
      - label: "analytics / BI"
        keywords: ["data analyst", "product analyst", "analytics", "business intelligence",
                   " bi ", "tableau", "looker", "dashboards", "insights", "kpis"]
  demote:
    points: 14
    note: "Analytics title but mostly reporting / Excel operations"
    applies_to: ["analytics / BI"]
    keywords: ["excel reporting", "bookkeeping", "data entry", "financial reporting"]
  weak:
    points: 10
    note: "Weak domain signal - generic data or Python role"
    keywords: ["python", " sql ", "pandas", "data pipeline", "data engineer", "statistics"]
  none:
    points: 5
    note: "No clear data science signal"

# ── Location (location string only) ─────────────────────────────────────────
location:
  tiers:
    - name: "Tel Aviv area"
      keywords: ["tel aviv", "tel-aviv", "tlv", "herzliya", "ramat gan", "givatayim", "petah tikva",
                 "petach tikva", "petah tiqva", "bnei brak", "holon", "bat yam", "rishon",
                 "raanana", "ra'anana", "kfar saba", "hod hasharon", "netanya", "rehovot",
                 "or yehuda", "airport city", "yafo"]
      max_office_days: 3
      rules:
        hybrid_within_limit: {score: 30, note: "Tel Aviv area hybrid ({days})"}
        hybrid_over_limit: {score: 22, note: "Tel Aviv area hybrid ({days} - above preferred limit)"}
        onsite: {score: 20, note: "Tel Aviv area on-site"}
        default: {score: 26, note: "Tel Aviv area - work mode unclear"}
  home_region:
    keywords: ["israel"]
    score: 18
    note: "Israel - outside the Tel Aviv area"
  remote:
    worldwide_regex: '\b(worldwide|global|anywhere|international)\b'
    worldwide: {score: 12, note: "Worldwide remote"}
    unclear: {score: 8, note: "Remote - geographic scope unclear"}
    restricted_regions:
      US: '\b(us|usa|united states|u\.s\.)\b'
      UK: '\b(uk|united kingdom|england)\b'
      Canada: '\b(canada)\b'
      EU: '\b(eu|europe|emea)\b'
    restricted: {score: 4, note: "{region}-restricted - not accessible from Israel"}
  elsewhere: {score: 2, note: "On-site outside Israel"}

# ── Seniority (extracted level from the title) ───────────────────────────────
seniority:
  levels:
    director:  {points: 2,  note: "Director - not an IC role"}
    vp:        {points: 0,  note: "VP - not an IC role"}
    principal: {points: 2,  note: "Principal - far above current level"}
    staff:     {points: 4,  note: "Staff - far above current level"}
    manager:   {points: 3,  note: "Manager - not an IC role"}
    lead:      {points: 8,  note: "Lead - stretch"}
    senior:    {points: 12, note: "Senior - stretch at 3 years"}
    mid:       {points: 20, note: "Mid-level - target level"}
    junior:    {points: 18, note: "Junior - target level"}
  unknown: {points: 10, note: "Seniority '{level}' - unclassified"}

# ── Bonus signals (full text); each match adds its points, total capped ──────
bonus:
  cap: 15
  signals:
    - label: "Python / SQL data stack"
      keywords: ["pandas", "scikit-learn", "sklearn", "numpy", "jupyter"]
      points: 5
    - label: "product company"
      keywords: ["our product", "product-led", "product teams", "saas", "b2c", "b2b"]
      points: 3
    - label: "mentorship / data science team"
      keywords: ["mentorship", "mentoring", "data science team", "team of data scientists",
                 "learn from"]
      points: 4

# ── Penalties (full text); first match applies ──────────────────────────────
penalties: []
