# user_profile.yaml - demo persona (fictional), generated by the build-profile skill from cv.pdf.
# The whole file is pasted into the LLM scorers' system prompt.

name: Dana Example
current_role: Software Engineer II, Payments Platform @ Nimbuspay
years_of_experience: 4
seniority: Mid-level, ready for Senior

# ─── Role Type ────────────────────────────────────────────────────────────────
role_type:
  open_to:
    - backend_engineer
    - platform_or_infrastructure_engineer
    - full_stack_engineer_backend_heavy
  ideal: >
    Mid or senior backend engineer on a product-driven team, owning services end to end
    (design, delivery, operations) with real influence on architecture.
  notes: >
    Individual contributor track. Not looking for management, frontend-only or mobile roles.

# ─── Location ─────────────────────────────────────────────────────────────────
location:
  current_country: Israel
  tiers:
    - tier: 1
      type: hybrid
      area: Tel Aviv area
      detail: "Tel Aviv, Herzliya, Ramat Gan, Petah Tikva and nearby"
      max_office_days: 3
    - tier: 2
      type: remote
      area: Remote within Israel
      detail: "Fully remote roles open to Israel-based engineers"
      max_office_days: null
  open_to_relocation: false

# ─── Company Stage ────────────────────────────────────────────────────────────
company_stage:
  preferred:
    - growth_startup_series_b_to_d
    - scaleup
  acceptable:
    - early_stage_series_a
    - large_enterprise_or_big_tech

# ─── Domains ──────────────────────────────────────────────────────────────────
domains:
  primary:
    - backend and distributed systems (APIs, microservices, event-driven architecture)
    - cloud platform engineering (Kubernetes, cloud-native services)
  open_to:
    - fintech and payments
    - data infrastructure and streaming
    - developer tooling and internal platforms
    - backend for AI-powered products
  notes: >
    The domain matters less than the engineering: ownership of production services,
    reliability and scale.

# ─── Hard Dealbreakers (auto-reject signals) ─────────────────────────────────
dealbreakers:
  - requires a security clearance
  - frontend-only or mobile-only role

# ─── Soft Negatives (demote score, do NOT auto-reject) ───────────────────────
soft_negatives:
  - mostly legacy maintenance (mainframe, COBOL, old .NET Framework)
  - government or defense contractor environments

# ─── Bonus Factors (boost score when present) ────────────────────────────────
bonus_factors:
  - Go and/or Kubernetes in the stack
  - strong engineering culture (code review, testing, mentorship)
  - scale-up pace with real ownership
  - high-scale or low-latency systems
