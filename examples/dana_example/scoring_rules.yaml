# scoring_rules.yaml - demo persona (fictional), generated by the build-profile skill.
# score = domain + location + seniority + bonus - penalty, clamped to [0, 100].
# Matching is case-insensitive substring matching; quoted spaces act as word boundaries.

# ── Title early exits (title only) ───────────────────────────────────────────
title_exclusions:
  hard:
    regex: '\b(intern|internship|new\s+grad|new\s+graduate|student)\b'
    reason: "intern, student or new-grad role"
    score: 5
  soft:
    score: 15
    phrases:
      - "counsel"
      - "attorney"
      - "accountant"
      - "finance manager"
      - "field marketing"
      - "content marketing"
      - "brand manager"
      - "recruiter"
      - "talent acquisition"
      - "human resources"
      - "people operations"
      - "account executive"
      - "sales development representative"
      - "sales manager"
      - "customer success"
      - "customer support"
      - "graphic designer"
      - "administrative"
      - "product manager"
      - "program manager"
      - "product designer"
      - "ux designer"
      - "data analyst"
      - "data scientist"

# ── Dealbreakers (full text) ─────────────────────────────────────────────────
dealbreakers:
  score: 5
  rules:
    - reason: "Requires a security clearance"
      any_of: ["security clearance", "clearance required", "active clearance"]
      unless_any_of: []
    - reason: "Frontend-only or mobile-only role"
      any_of: ["frontend engineer", "front-end engineer", "frontend developer", "front-end developer",
               "ios engineer", "ios developer", "android engineer", "android developer", "mobile engineer"]
      unless_any_of: ["backend", "back-end", "full stack", "full-stack", "fullstack", "server-side"]

# ── Domain (full text) ───────────────────────────────────────────────────────
domains:
  primary:
    label: "Backend / distributed systems"
    points: 35
    keywords: ["backend", "back-end", "server-side", "distributed system", "microservice",
               "event-driven", "golang", " go ", "grpc", "rest api", "apis", "kafka",
               "postgresql", "high scale", "high-scale", "low latency", "low-latency", "cloud-native"]
  open_to:
    points: 22
    areas:
      - label: "platform / infrastructure"
        keywords: ["kubernetes", "platform engineer", "infrastructure", "devops", "site reliability",
                   " sre ", "terraform", "cloud platform"]
      - label: "data infrastructure"
        keywords: ["data pipeline", "streaming", "data platform", "data infrastructure", "etl", "spark"]
      - label: "fintech / payments"
        keywords: ["payments", "fintech", "billing", "banking", "money movement"]
      - label: "developer tooling"
        keywords: ["developer tool", "developer platform", "developer experience", "devex", "ci/cd", "observability"]
  demote:
    points: 14
    note: "Infrastructure title but mostly IT / networking operations"
    applies_to: ["platform / infrastructure"]
    keywords: ["helpdesk", "help desk", "it operations", "network administrator", "windows server"]
  weak:
    points: 10
    note: "Generic software role - no specific backend signal"
    keywords: ["software engineer", "software developer", "python", "java", "node.js", "typescript"]
  none:
    points: 5
    note: "No clear backend signal"

# ── Location (location string only) ──────────────────────────────────────────
location:
  tiers:
    - name: "Tel Aviv area"
      keywords: ["tel aviv", "tel-aviv", "herzliya", "ramat gan", "givatayim", "petah tikva",
                 "petach tikva", "bnei brak", "holon", "bat yam", "rishon", "raanana", "ra'anana",
                 "kfar saba", "hod hasharon", "netanya", "rehovot", "or yehuda", "airport city"]
      max_office_days: 3
      rules:
        hybrid_within_limit: {score: 30, note: "Tel Aviv area hybrid ({days})"}
        hybrid_over_limit: {score: 22, note: "Tel Aviv area hybrid ({days} - above preferred limit)"}
        onsite: {score: 20, note: "Tel Aviv area on-site"}
        default: {score: 26, note: "Tel Aviv area - work mode unclear"}
  home_region:
    keywords: ["israel"]
    score: 18
    note: "Israel - outside the Tel Aviv area"
  remote:
    worldwide_regex: '\b(worldwide|global|anywhere|international)\b'
    worldwide: {score: 14, note: "Worldwide remote"}
    unclear: {score: 8, note: "Remote - geographic scope unclear"}
    restricted_regions:
      US: '\b(us|usa|united states|u\.s\.)\b'
      UK: '\b(uk|united kingdom|england)\b'
    restricted: {score: 4, note: "{region}-restricted - not accessible from Israel"}
  elsewhere: {score: 2, note: "On-site outside Israel"}

# ── Seniority ────────────────────────────────────────────────────────────────
seniority:
  levels:
    director:  {points: 2,  note: "Director - not an IC role"}
    vp:        {points: 0,  note: "VP - not an IC role"}
    principal: {points: 6,  note: "Principal - well above current level"}
    staff:     {points: 10, note: "Staff - stretch"}
    manager:   {points: 4,  note: "Manager - not an IC role"}
    lead:      {points: 12, note: "Lead - stretch"}
    senior:    {points: 20, note: "Senior - target level"}
    mid:       {points: 18, note: "Mid-level - target level"}
    junior:    {points: 6,  note: "Junior - below current level"}
  unknown: {points: 10, note: "Seniority '{level}' - unclassified"}

# ── Bonus signals ────────────────────────────────────────────────────────────
bonus:
  cap: 15
  signals:
    - label: "Go and/or Kubernetes in the stack"
      keywords: ["golang", " go ", "kubernetes", "k8s"]
      points: 4
    - label: "strong engineering culture"
      keywords: ["code review", "mentorship", "mentoring", "testing culture", "engineering culture", "tdd"]
      points: 3
    - label: "scale-up pace with ownership"
      keywords: ["scale-up", "scaleup", "fast-paced", "fast paced", "ownership", "end-to-end", "end to end"]
      points: 3
    - label: "high-scale or low-latency systems"
      keywords: ["millions of", "high scale", "high-scale", "low latency", "low-latency", "high throughput"]
      points: 3

# ── Penalties ────────────────────────────────────────────────────────────────
penalties:
  - reason: "Government / defense environment"
    keywords: ["ministry of defense", "defense contractor", "government agency", "public sector"]
    points: 6
  - reason: "Mostly legacy maintenance"
    keywords: ["cobol", "mainframe", ".net framework", "legacy system"]
    points: 6
