# user_profile.yaml - the candidate's preferences, in plain language.
#
# The whole file is pasted into the LLM scorers' system prompt (Ollama / HuggingFace / Claude),
# so write it for a reader, not a parser: short phrases, comments welcome.
# Keyword rules for the fast RulesEngine live separately in scoring_rules.yaml.
# Generated by the build-profile skill (.claude/skills/build-profile/); edit freely.

name: <Full name>
current_role: <Title @ Company>
years_of_experience: <N>
seniority: <e.g. Mid-level / Senior / Staff>

# ─── Role Type ────────────────────────────────────────────────────────────────
role_type:
  open_to:
    - <role type, e.g. backend_engineer>
    - <role type, e.g. full_stack_engineer>
  ideal: >
    <One or two sentences describing the ideal next role.>
  notes: >
    <Anything else about role shape: IC vs management, team size, scope.>

# ─── Location ─────────────────────────────────────────────────────────────────
location:
  current_country: <Country>
  tiers:                      # priority-ordered, tier 1 = best
    - tier: 1
      type: <on_site_or_hybrid | hybrid | remote>
      area: <Area name>
      detail: "<Cities in this area>"
      max_office_days: <N or null>
    - tier: 2
      type: remote
      area: <e.g. Remote within the country>
      detail: "<Details>"
      max_office_days: null
  open_to_relocation: <true | false>

# ─── Company Stage ────────────────────────────────────────────────────────────
company_stage:
  preferred:
    - <e.g. growth_startup_series_b_to_d>
  acceptable:
    - <e.g. large_enterprise_or_big_tech>
  notes: >
    <Optional.>

# ─── Domains ──────────────────────────────────────────────────────────────────
domains:
  primary:                    # strongest pull
    - <domain>
  open_to:                    # mild positive, unordered
    - <domain>
  notes: >
    <Optional qualifications, e.g. "only when the role is product-facing".>

# ─── Compensation (optional) ──────────────────────────────────────────────────
compensation:
  currency: <e.g. USD / EUR / NIS>
  base_monthly:
    floor: <number or null>
    target: <number or null>
  notes: >
    <Optional.>

# ─── Hard Dealbreakers (auto-reject signals) ─────────────────────────────────
dealbreakers:
  - <e.g. requires security clearance>

# ─── Soft Negatives (demote score, do NOT auto-reject) ───────────────────────
soft_negatives:
  - <e.g. heavy on-call rotation>

# ─── Bonus Factors (boost score when present) ────────────────────────────────
bonus_factors:
  - <e.g. modern stack (Go / Kubernetes / cloud-native)>
  - <e.g. strong engineering culture: code review, testing, mentorship>
