# scoring_rules.yaml - keyword rules for the RulesEngine (per-user config).
#
# Generated by the build-profile skill; edit freely. The engine structure is fixed:
#   score = domain + location + seniority + bonus - penalty, clamped to [0, 100]
# with title / dealbreaker early exits checked first. Suggested maxima keep the scale
# comparable to the LLM engines: domain 35, location 30, seniority 20, bonus 15.
#
# Matching is case-insensitive substring matching on the lowercased text
# (title + location + plain-text description) unless noted otherwise.
# Keep leading/trailing spaces in quoted keywords such as " go " - they act as crude word boundaries.
# Values below are neutral placeholders for a generic software engineer.

# ── Title early exits (title only) ───────────────────────────────────────────
title_exclusions:
  hard:                       # regex on the title -> dealbreaker
    regex: '\b(intern|internship|new\s+grad|new\s+graduate)\b'
    reason: "intern or new-grad role"
    score: 5
  soft:                       # title contains a phrase -> this score (not a dealbreaker)
    score: 15
    phrases:                  # functions outside the target role type
      - "counsel"
      - "attorney"
      - "accountant"
      - "finance manager"
      - "field marketing"
      - "content marketing"
      - "brand manager"
      - "recruiter"
      - "talent acquisition"
      - "human resources"
      - "people operations"
      - "account executive"
      - "sales development representative"
      - "sales manager"
      - "customer success"
      - "customer support"
      - "graphic designer"
      - "administrative"

# ── Dealbreakers (full text): any_of matches AND no unless_any_of matches ────
dealbreakers:
  score: 5
  rules:
    - reason: "<why this is a dealbreaker>"
      any_of: ["<keyword>"]
      unless_any_of: []

# ── Domain (full text) ───────────────────────────────────────────────────────
domains:
  primary:
    label: "<primary domain>"
    points: 35
    keywords: ["<keyword>", "<keyword>"]
  open_to:                    # checked in order, first match wins
    points: 22
    areas:
      - label: "<adjacent domain>"
        keywords: ["<keyword>"]
  demote:                     # optional: area matched but these keywords also appear
    points: 14
    note: "<why it is demoted>"
    applies_to: []            # open_to labels this demotion applies to
    keywords: []
  weak:
    points: 10
    note: "Weak domain signal - no specific match"
    keywords: ["<broad keyword>"]
  none:
    points: 5
    note: "No clear domain signal"

# ── Location (location string only) ─────────────────────────────────────────
# Tiers in priority order; first match wins. Either a single score/note, or per-work-mode
# `rules`: hybrid_within_limit, hybrid_over_limit, onsite, default (required).
# Notes may use {days}, e.g. "2 days/week" or "unknown days".
location:
  tiers:
    - name: "<preferred area>"
      keywords: ["<city>", "<nearby city>"]
      max_office_days: 3
      rules:
        hybrid_within_limit: {score: 30, note: "<area> hybrid ({days})"}
        hybrid_over_limit: {score: 22, note: "<area> hybrid ({days} - above preferred limit)"}
        onsite: {score: 20, note: "<area> on-site"}
        default: {score: 26, note: "<area> - work mode unclear"}
  home_region:                # anywhere else in the home country/region
    keywords: ["<country>"]
    score: 15
    note: "<country> - outside preferred area"
  remote:
    worldwide_regex: '\b(worldwide|global|anywhere|international)\b'
    worldwide: {score: 12, note: "Worldwide remote"}
    unclear: {score: 8, note: "Remote - geographic scope unclear"}
    restricted_regions:       # region-locked postings you can't take
      US: '\b(us|usa|united states|u\.s\.)\b'
      UK: '\b(uk|united kingdom|england)\b'
    restricted: {score: 4, note: "{region}-restricted - not accessible"}
  elsewhere: {score: 2, note: "On-site outside preferred locations"}

# ── Seniority (extracted level from the title) ───────────────────────────────
# Levels produced by extraction: director, vp, principal, staff, manager, lead, senior, mid, junior.
seniority:
  levels:
    director:  {points: 4,  note: "Director-level - above target"}
    vp:        {points: 2,  note: "VP-level - above target"}
    principal: {points: 6,  note: "Principal - above target"}
    staff:     {points: 10, note: "Staff - stretch"}
    manager:   {points: 6,  note: "Manager - different track"}
    lead:      {points: 14, note: "Lead - stretch"}
    senior:    {points: 20, note: "Senior - target level"}
    mid:       {points: 18, note: "Mid-level - target level"}
    junior:    {points: 6,  note: "Junior - below target"}
  unknown: {points: 10, note: "Seniority '{level}' - unclassified"}

# ── Bonus signals (full text); each match adds its points, total capped ──────
bonus:
  cap: 15
  signals:
    - label: "<bonus factor>"
      keywords: ["<keyword>"]
      points: 3

# ── Penalties (full text); first match applies ──────────────────────────────
penalties:
  - reason: "<soft negative>"
    keywords: ["<keyword>"]
    points: 4
